<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        background: #fbf9f4;
        color: #191612;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        padding: 56px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        word-break: keep-all;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1px solid #191612;
        padding-bottom: 20px;
        font-size: 19px;
        color: #6b6357;
        letter-spacing: -0.01em;
      }
      .brand {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 46px;
        color: #191612;
        letter-spacing: -0.01em;
      }
      h1 {
        font-size: 74px;
        line-height: 1.18;
        letter-spacing: -0.045em;
        font-weight: 750;
        margin-top: 8px;
      }
      .rule { height: 1px; background: #dcd5c7; margin: 34px 0 22px; }
      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 20px;
        color: #5c544a;
        letter-spacing: -0.01em;
      }
      .cat { font-size: 20px; color: #9c4a2f; font-weight: 600; }
    </style>
  </head>
  <body>
    <div>
      <div class="top">
        <span class="brand">buffetkimz</span>
        <span>금융과 돈에 관한 기록, 그리고 직접 만든 도구</span>
      </div>
      <h1>기록이 쌓이고,<br />도구가 늘어나는 곳.</h1>
      <div class="rule"></div>
      <p style="font-size: 24px; line-height: 1.6; color: #2e2924; max-width: 900px">
        금리와 환율, 보험과 연금, 노후와 AI. 매일 쌓는 글과 현장에서 만든 계산 도구를 한곳에.
      </p>
    </div>
    <div class="bottom">
      <span class="cat">금융 · 투자 · 경제 · 보험 · 노후준비 · 연금 · AI · 철학</span>
      <span>buffetkimz.com</span>
    </div>
  </body>
</html>
