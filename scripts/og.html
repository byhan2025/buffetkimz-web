<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* v7.9.0 — 확정 공식 로고(밝은 바탕 영문)를 중심으로 한 기본 OG 카드 */
      body {
        width: 1200px;
        height: 630px;
        position: relative;
        overflow: hidden;
        background-color: #faf7ef;
        background-image:
          radial-gradient(58% 52% at 50% 0%, #eef2ff 0%, rgba(250, 247, 239, 0) 68%),
          radial-gradient(40% 40% at 100% 100%, #f2f4ff 0%, rgba(250, 247, 239, 0) 60%);
        color: #0b1b29;
        font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR",
          sans-serif;
        padding: 54px 72px 44px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        word-break: keep-all;
      }
      .bar { position: absolute; left: 0; right: 0; top: 0; height: 6px; background: #1a4ffd; }
      .logo { height: 122px; margin-top: 44px; display: block; }
      .mid { text-align: center; margin-top: -26px; }
      .thesis {
        font-size: 64px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.04em;
        color: #0b1b29;
      }
      .line {
        margin-top: 18px;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: #3f4b57;
      }
      .bottom {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #dde3e8;
        padding-top: 16px;
        font-size: 18px;
        color: #55626e;
      }
      .bottom b { color: #0b1b29; font-weight: 650; }
      .bottom .mono {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: 0.06em;
        color: #55626e;
      }
    </style>
  </head>
  <body>
    <span class="bar"></span>

    <img class="logo" src="../public/brand/logo-en-light-tr-1920.webp" alt="buffetkimz" />

    <div class="mid">
      <p class="thesis">숫자 너머의 기준</p>
      <p class="line">금융 · 투자 · 연금 · 노후 · 보험 — 매일 기록하고, 기준일과 1차 출처를 함께 남깁니다</p>
    </div>

    <div class="bottom">
      <span><b>buffetkimz.com</b> — 모든 글과 도구에 기준일·1차 출처</span>
      <span class="mono">기록 · 기준 · 도구</span>
    </div>
  </body>
</html>
