<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        position: relative;
        overflow: hidden;
        background-color: #04101a;
        background-image:
          radial-gradient(70% 60% at 50% 46%, #10514c 0%, rgba(4, 16, 26, 0) 66%),
          radial-gradient(80% 62% at 88% 2%, #123b52 0%, rgba(4, 16, 26, 0) 58%),
          linear-gradient(158deg, #05141f 0%, #04101a 46%, #020a12 100%);
        color: #ffffff;
        font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo",
          "Noto Sans KR", sans-serif;
        padding: 62px 76px 58px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        word-break: keep-all;
      }
      /* 빛 입자 — 다만 장식. 텍스트 워드마크만 쓴다(붓글씨 로고 없음) */
      .dust { position: absolute; inset: 0; pointer-events: none; }
      .dust i {
        position: absolute;
        display: block;
        border-radius: 999px;
        background: #7fe3c4;
        opacity: 0.55;
        box-shadow: 0 0 8px rgba(127, 227, 196, 0.8);
      }
      .rings {
        position: absolute;
        left: 50%;
        top: 52%;
        width: 560px;
        height: 560px;
        margin: -280px 0 0 -280px;
        border-radius: 999px;
        border: 1px solid rgba(127, 227, 196, 0.22);
        pointer-events: none;
      }
      .rings::after {
        content: "";
        position: absolute;
        inset: 96px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .top { display: flex; align-items: baseline; justify-content: space-between; position: relative; }
      .wordmark {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 40px;
        line-height: 1;
        letter-spacing: -0.01em;
        color: #ffffff;
      }
      .kicker {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 16px;
        letter-spacing: 0.24em;
        color: #7fe3c4;
      }
      .mid { position: relative; text-align: center; }
      .line1 {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #c6dbe9;
      }
      .mark {
        margin-top: 6px;
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 132px;
        line-height: 0.98;
        letter-spacing: -0.02em;
        color: #ffffff;
        text-shadow: 0 0 60px rgba(127, 227, 196, 0.45);
      }
      .thesis {
        margin-top: 14px;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #ffffff;
      }
      .bottom {
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid rgba(255, 255, 255, 0.18);
        padding-top: 18px;
        font-size: 17px;
        color: #a9c0d0;
      }
      .bottom .mono {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: 0.06em;
        color: #8fa8ba;
      }
      .bottom b { color: #ffffff; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="dust" id="dust"></div>
    <div class="rings"></div>

    <div class="top">
      <span class="wordmark">buffetkimz</span>
      <span class="kicker">BRAND FILM 2026</span>
    </div>

    <div class="mid">
      <p class="line1">금융 · 투자 · 연금 · 노후 · 보험을 매일 기록합니다</p>
      <p class="mark">buffetkimz</p>
      <p class="thesis">숫자 너머의 기준</p>
    </div>

    <div class="bottom">
      <span><b>기록 · 기준 · 태도</b> — 모든 글에 기준일과 1차 출처</span>
      <span class="mono">buffetkimz.com · 2026. 11. 19.</span>
    </div>

    <script>
      // 고정된 씨앗으로 같은 그림을 만든다(캡처가 매번 같도록).
      let s = 20261119;
      const rnd = () => ((s = (s * 1103515245 + 12345) % 2147483648) / 2147483648);
      const box = document.getElementById("dust");
      for (let i = 0; i < 90; i++) {
        const el = document.createElement("i");
        const size = 1 + rnd() * 3.4;
        el.style.width = `${size}px`;
        el.style.height = `${size}px`;
        el.style.left = `${rnd() * 100}%`;
        el.style.top = `${rnd() * 100}%`;
        el.style.opacity = String(0.16 + rnd() * 0.6);
        box.appendChild(el);
      }
    </script>
  </body>
</html>
