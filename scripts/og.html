<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        position: relative;
        overflow: hidden;
        background: #ffffff;
        background-image:
          radial-gradient(90% 80% at 100% 0%, rgb(190 224 252 / 0.62) 0%, rgb(255 255 255 / 0) 62%),
          linear-gradient(180deg, #ffffff 0%, #f5faff 58%, #eaf4ff 100%);
        color: #0b1b29;
        font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        padding: 54px 68px 46px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        word-break: keep-all;
      }
      .frame {
        border: 1px solid #d5e4f0;
        border-radius: 26px;
        background: rgb(255 255 255 / 0.72);
        padding: 30px 34px 28px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        height: 100%;
        justify-content: space-between;
      }
      .top { display: flex; justify-content: space-between; align-items: center; }
      .brand img { height: 46px; width: auto; display: block; }
      .tag { font-size: 17px; color: #3f4b57; letter-spacing: -0.01em; }
      h1 {
        font-size: 68px;
        line-height: 1.16;
        letter-spacing: -0.045em;
        font-weight: 700;
      }
      h1 em { font-style: normal; color: #0e5344; }
      .sub { font-size: 21px; line-height: 1.6; color: #3f4b57; max-width: 860px; margin-top: 10px; }
      .bottom {
        display: flex; justify-content: space-between; align-items: center;
        border-top: 1px solid #dbe6ef; padding-top: 16px;
        font-size: 16px; color: #55626e;
      }
      .cat { color: #0e5344; font-weight: 600; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="top">
        <span class="brand"><img src="../public/brand/logo-buffetkimz-240.png" alt="버핏킴즈" /></span>
        <span class="tag">금융 · 투자 · 연금 · 노후준비의 기록과 도구</span>
      </div>
      <div>
        <h1>확인한 것과,<br /><em>계산한 것으로만</em> 씁니다.</h1>
        <p class="sub">
          공개된 1차 자료로 확인한 기준과 기준일을 붙여 남기고, 되풀이되는 계산은 브라우저에서 바로 쓰는
          도구로 옮겼습니다.
        </p>
      </div>
      <div class="bottom">
        <span class="cat">금융 · 투자 · 연금 · 노후 · 경제 · AI · 보험</span>
        <span class="mono">buffetkimz.com · 2026. 11. 19.</span>
      </div>
    </div>
  </body>
</html>
